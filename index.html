<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二十岁生日快乐！</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffd452 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ========== 页面容器 ========== */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .page.active { display: flex; }

    /* ========== 登录卡片 ========== */
    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card h1 {
      font-size: 2rem;
      color: #e8456b;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
      background: #fafafa;
    }

    .input-group input:focus {
      border-color: #f5576c;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(245,87,108,0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245,87,108,0.4);
    }

    .login-btn:active { transform: translateY(0); }

    .error-msg {
      color: #e8456b;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* ========== 生日页面 ========== */
    .birthday-content {
      text-align: center;
      animation: fadeInUp 0.8s ease;
      position: relative;
      z-index: 2;
    }

    .birthday-content h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: bounceIn 1s ease;
      margin-bottom: 10px;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { transform: scale(1.08); }
      70% { transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .birthday-content .age {
      font-size: 6rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 6px 30px rgba(0,0,0,0.3);
      line-height: 1;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 6px 30px rgba(0,0,0,0.3); }
      50% { text-shadow: 0 6px 50px rgba(255,255,255,0.6), 0 0 80px rgba(255,200,100,0.4); }
    }

    .next-btn {
      margin-top: 40px;
      padding: 14px 40px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .next-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }

    /* ========== 彩带画布 ========== */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ========== 信件页面 ========== */
    .letter-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: fadeInUp 0.6s ease;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      z-index: 2;
    }

    .letter-card .letter-icon {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 10px;
    }

    .letter-card h2 {
      text-align: center;
      color: #e8456b;
      margin-bottom: 25px;
      font-size: 1.5rem;
    }

    .letter-body {
      font-size: 1.05rem;
      line-height: 2;
      color: #444;
      white-space: pre-wrap;
      font-family: "STKaiti", "KaiTi", "楷体", "PingFang SC", serif;
    }

    .letter-body .placeholder {
      color: #bbb;
      font-style: italic;
    }

    .back-btn {
      display: block;
      margin: 30px auto 0;
      padding: 10px 30px;
      background: transparent;
      color: #e8456b;
      border: 2px solid #e8456b;
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: #e8456b;
      color: #fff;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 480px) {
      .login-card, .letter-card {
        padding: 30px 24px;
      }
      .birthday-content .age { font-size: 4rem; }
    }
  </style>
</head>
<body>

  <!-- ==================== 第一页：登录 ==================== -->
  <div class="page active" id="login-page">
    <div class="login-card">
      <h1>🎂</h1>
      <p class="subtitle">请输入密码以继续</p>
      <div class="input-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="login-btn" onclick="handleLogin()">登 录</button>
      <p class="error-msg" id="error-msg">用户名或密码错误，请重试</p>
    </div>
  </div>

  <!-- ==================== 第二页：生日快乐 ==================== -->
  <div class="page" id="birthday-page">
    <canvas id="confetti-canvas"></canvas>
    <div class="birthday-content">
      <div class="age">20</div>
      <h1>二十岁生日快乐！</h1>
      <p style="color:rgba(255,255,255,0.8); margin-top:8px; font-size:1.1rem;">🎉 希望我们可以一起走向更好的未来呀！ 🎉</p>
      <button class="next-btn" onclick="showPage('letter-page')">💌 打开信件</button>
    </div>
  </div>

  <!-- ==================== 第三页：信件 ==================== -->
  <div class="page" id="letter-page">
    <div class="letter-card">
      <div class="letter-icon">💌</div>
      <h2>写给你的一封信</h2>
      <div class="letter-body" id="letter-content">
        <span class="placeholder">（信的内容即将更新，敬请期待...）</span>
      </div>
      <button class="back-btn" onclick="showPage('birthday-page')">← 返回</button>
    </div>
  </div>

  <script>
    // ========== 页面切换 ==========
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      if (pageId === 'birthday-page') startConfetti();
      if (pageId !== 'birthday-page') stopConfetti();
    }

    // ========== 登录逻辑 ==========
    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (username === 'xgx' && password === '241220') {
        errorMsg.classList.remove('show');
        showPage('birthday-page');
      } else {
        errorMsg.classList.add('show');
        // 抖动效果
        const card = document.querySelector('.login-card');
        card.style.animation = 'none';
        card.offsetHeight; // reflow
        card.style.animation = 'shake 0.5s ease';
      }
    }

    // 回车键登录
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('username').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    // 抖动动画
    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        60% { transform: translateX(-7px); }
        80% { transform: translateX(7px); }
      }
    `;
    document.head.appendChild(shakeStyle);

    // ========== 彩带效果 ==========
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiPieces = [];
    let animationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createConfetti() {
      const colors = [
        '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
        '#ff922b', '#ff6eb4', '#845ef7', '#20c997',
        '#f06595', '#ffe066', '#748ffc', '#8ce99a',
        '#f783ac', '#ffa94d', '#a9e34b', '#79d2f2'
      ];
      confettiPieces = [];
      for (let i = 0; i < 180; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 12 + 5,
          h: Math.random() * 8 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 2.5 + 1.5,
          speedX: (Math.random() - 0.5) * 1.5,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 6,
          swaySpeed: Math.random() * 0.02 + 0.01,
          swayAmount: Math.random() * 0.8 + 0.3,
          time: Math.random() * Math.PI * 2,
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
    }

    function updateConfetti() {
      confettiPieces.forEach(p => {
        p.y += p.speedY;
        p.time += p.swaySpeed;
        p.x += Math.sin(p.time) * p.swayAmount + p.speedX * 0.3;
        p.rotation += p.rotationSpeed;

        // 循环：超出底部后回到顶部
        if (p.y > canvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
        // 水平循环
        if (p.x > canvas.width + 30) p.x = -30;
        if (p.x < -30) p.x = canvas.width + 30;
      });
    }

    function confettiLoop() {
      drawConfetti();
      updateConfetti();
      animationId = requestAnimationFrame(confettiLoop);
    }

    function startConfetti() {
      resizeCanvas();
      createConfetti();
      if (!animationId) confettiLoop();
    }

    function stopConfetti() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ========== 加载信件内容（如果用户编辑了 letter.txt） ==========
    fetch('letter.txt')
      .then(res => {
        if (res.ok) return res.text();
        throw new Error('no letter file');
      })
      .then(text => {
        const content = document.getElementById('letter-content');
        if (text.trim()) {
          content.textContent = text.trim();
          content.classList.remove('placeholder');
        }
      })
      .catch(() => {
        // 没有信件文件，保持占位文字
      });
  </script>
</body>
</html>
