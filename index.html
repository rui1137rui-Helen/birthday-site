<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二十岁生日快乐！</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      transition: background 1s ease;
    }

    /* ========== 全局背景渐变 ========== */
    body.bg-login {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffd452 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }
    body.bg-romantic {
      background: linear-gradient(135deg, #fbc2eb 0%, #fda085 30%, #f6d365 60%, #fbc2eb 100%);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
    }
    body.bg-love {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
    }
    body.bg-congrats {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 40%, #d4fc79 100%);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
    }
    body.bg-birthday {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffd452 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ========== 页面容器 ========== */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
    }
    .page.active { display: flex; }

    /* ========== 全局画布（爱心、树等） ========== */
    #decoration-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ========== 登录卡片 ========== */
    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeInUp 0.6s ease;
      position: relative;
      z-index: 2;
      border: 2px solid transparent;
      transition: box-shadow 0.4s ease, border 0.4s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .login-card h1 {
      font-size: 2rem;
      color: #e8456b;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: #999;
      font-size: 0.85rem;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.4s ease;
      outline: none;
      background: #fafafa;
    }

    .input-group input:focus {
      border-color: #f5576c;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(245,87,108,0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245,87,108,0.4);
    }
    .login-btn:active { transform: translateY(0); }

    .error-msg {
      color: #e8456b;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* ========== 计时器 + 问答页面 ========== */
    .counter-content {
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeInUp 0.8s ease;
      padding: 20px;
    }

    .counter-content .time-label {
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .counter-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .counter-stat {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px 20px;
      min-width: 90px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .counter-stat .number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
      line-height: 1.1;
    }

    .counter-stat .unit {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
    }

    /* 问答卡片 */
    .quiz-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 36px 30px;
      max-width: 500px;
      width: 90%;
      margin: 20px auto 0;
      box-shadow: 0 15px 50px rgba(0,0,0,0.12);
      animation: fadeInUp 0.6s ease 0.3s both;
      position: relative;
      z-index: 2;
    }

    .quiz-card h2 {
      color: #e8456b;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .quiz-option {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff5f7, #fff);
      border: 2px solid #ffe0e6;
      border-radius: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
      color: #555;
      position: relative;
    }

    .quiz-option:hover {
      border-color: #f5576c;
      background: #fff0f3;
      transform: translateX(4px);
      box-shadow: 0 4px 15px rgba(245,87,108,0.15);
    }

    .quiz-option .option-label {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border-radius: 50%;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      margin-right: 10px;
    }

    /* ========== 结果页面 A / B ========== */
    .result-content {
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeInUp 0.6s ease;
    }

    .result-content h1 {
      font-size: clamp(2rem, 7vw, 3.5rem);
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.15);
      margin-bottom: 12px;
    }

    .result-content .result-subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 1rem;
      margin-bottom: 30px;
    }

    .heart-btn, .back-quiz-btn {
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
      border: 2px solid rgba(255,255,255,0.5);
      color: #fff;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }

    .heart-btn:hover, .back-quiz-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    /* ========== 结果页面 C ========== */
    .congrats-content {
      text-align: center;
      position: relative;
      z-index: 2;
      animation: bounceIn 1s ease;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { transform: scale(1.08); }
      70% { transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .congrats-content h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      color: #2d2d2d;
      text-shadow: 0 4px 30px rgba(0,0,0,0.08);
      margin-bottom: 8px;
    }

    .congrats-content p { color: #4a4a4a; }

    .congrats-content .sparkles {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    .continue-btn {
      margin-top: 30px;
      padding: 16px 50px;
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 2px;
      box-shadow: 0 6px 25px rgba(255,154,158,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 25px rgba(255,154,158,0.4); }
      50% { box-shadow: 0 6px 40px rgba(255,154,158,0.7), 0 0 60px rgba(254,207,239,0.4); }
    }

    .continue-btn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    /* ========== 生日页面 ========== */
    .birthday-content {
      text-align: center;
      animation: fadeInUp 0.8s ease;
      position: relative;
      z-index: 2;
    }

    .birthday-content h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: bounceIn 1s ease;
      margin-bottom: 10px;
    }

    .birthday-content .age {
      font-size: 6rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 6px 30px rgba(0,0,0,0.3);
      line-height: 1;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 6px 30px rgba(0,0,0,0.3); }
      50% { text-shadow: 0 6px 50px rgba(255,255,255,0.6), 0 0 80px rgba(255,200,100,0.4); }
    }

    .next-btn {
      margin-top: 40px;
      padding: 14px 40px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .next-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }

    /* ========== 彩带画布 ========== */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ========== 信件页面 ========== */
    .letter-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: fadeInUp 0.6s ease;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      z-index: 2;
    }

    .letter-card .letter-icon {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 10px;
    }

    .letter-card h2 {
      text-align: center;
      color: #e8456b;
      margin-bottom: 25px;
      font-size: 1.5rem;
    }

    .letter-body {
      font-size: 1.05rem;
      line-height: 2;
      color: #444;
      white-space: pre-wrap;
      font-family: "STKaiti", "KaiTi", "楷体", "PingFang SC", serif;
    }

    .letter-body .placeholder {
      color: #bbb;
      font-style: italic;
    }

    .back-btn {
      display: block;
      margin: 30px auto 0;
      padding: 10px 30px;
      background: transparent;
      color: #e8456b;
      border: 2px solid #e8456b;
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: #e8456b;
      color: #fff;
    }

    /* ========== 照片墙页面 ========== */
    .gallery-wrapper {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 90vh;
      margin: 0 auto;
    }

    .gallery-heart {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .gallery-photo {
      position: absolute;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.7);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
      contain: layout style paint;
    }
    .gallery-photo.shown { opacity: 1; }

    .gallery-photo:hover {
      transform: scale(1.2) rotate(0deg) !important;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
      z-index: 999 !important;
    }

    /* 照片墙加载提示 */
    .gallery-loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      z-index: 5;
      pointer-events: none;
      animation: emojiPulse 0.8s ease-in-out infinite;
    }
    @keyframes emojiPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.25); }
    }

    /* ========== 灯箱（点击放大） ========== */
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .lightbox-overlay.active { display: flex; }

    .lightbox-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease;
    }

    /* ========== 照片墙返回按钮 ========== */
    .gallery-back-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      padding: 10px 24px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }
    .gallery-back-btn:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }

    .gallery-back-btn.dark {
      color: #444 !important;
      border-color: rgba(0,0,0,0.25) !important;
      background: rgba(0,0,0,0.08) !important;
    }
    .gallery-back-btn.dark:hover {
      background: rgba(0,0,0,0.15) !important;
    }

    /* ========== 信件页面装饰 ========== */
    .letter-decorations {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .letter-deco {
      position: absolute;
      font-size: 2rem;
      opacity: 0;
      animation-fill-mode: both;
    }
    /* 气球 */
    .deco-balloon-1 { top: 5%; left: 8%; animation: floatUpDown 4s ease-in-out infinite 0.3s; }
    .deco-balloon-2 { top: 12%; right: 10%; animation: floatUpDown 4.5s ease-in-out infinite 1s; }
    /* 蛋糕 */
    .deco-cake { bottom: 10%; left: 6%; animation: floatUpDown 5s ease-in-out infinite 0.8s; font-size: 2.5rem; }
    /* 花花 */
    .deco-flower-1 { top: 25%; left: 3%; animation: swayFlower 5s ease-in-out infinite 0.5s; font-size: 1.8rem; }
    .deco-flower-2 { top: 60%; right: 5%; animation: swayFlower 4.8s ease-in-out infinite 1.5s; font-size: 2rem; }
    .deco-flower-3 { bottom: 20%; left: 12%; animation: swayFlower 5.5s ease-in-out infinite 2s; font-size: 1.6rem; }
    /* 云朵 */
    .deco-cloud-1 { top: 8%; left: 30%; animation: cloudDrift 12s linear infinite; font-size: 2.5rem; }
    .deco-cloud-2 { top: 18%; right: 20%; animation: cloudDrift 14s linear infinite 3s; font-size: 2rem; }
    /* 星星闪烁 */
    .deco-sparkle-1 { top: 15%; left: 50%; animation: twinkle 2.5s ease-in-out infinite; font-size: 1.5rem; }
    .deco-sparkle-2 { top: 70%; right: 15%; animation: twinkle 3s ease-in-out infinite 1s; font-size: 1.8rem; }
    .deco-sparkle-3 { bottom: 35%; left: 20%; animation: twinkle 2.8s ease-in-out infinite 0.5s; }
    .deco-star { top: 40%; left: 55%; animation: twinkle 3.5s ease-in-out infinite 1.8s; font-size: 2.2rem; }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0); opacity: 0.75; }
      50% { transform: translateY(-18px); opacity: 1; }
    }
    @keyframes swayFlower {
      0%, 100% { transform: rotate(-5deg) translateY(0); opacity: 0.7; }
      50% { transform: rotate(5deg) translateY(-10px); opacity: 1; }
    }
    @keyframes cloudDrift {
      0% { transform: translateX(-20px); opacity: 0.5; }
      25% { transform: translateX(10px); opacity: 0.8; }
      50% { transform: translateX(30px); opacity: 0.5; }
      75% { transform: translateX(5px); opacity: 0.7; }
      100% { transform: translateX(-20px); opacity: 0.5; }
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.8); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* ========== 响应式 ========== */
    @media (max-width: 480px) {
      .login-card, .letter-card, .quiz-card {
        padding: 30px 20px;
      }
      .birthday-content .age { font-size: 4rem; }
      .counter-stat {
        min-width: 65px;
        padding: 12px 14px;
      }
      .counter-stat .number { font-size: 1.6rem; }
      .quiz-option { font-size: 0.9rem; padding: 12px 14px; }
    }
  </style>
</head>
<body class="bg-login">

  <!-- ==================== 装饰画布（爱心树、飘浮爱心） ==================== -->
  <canvas id="decoration-canvas"></canvas>

  <!-- ==================== 全局返回按钮（始终在 body 层，不受页面切换影响） ==================== -->
  <button id="global-back-btn" class="gallery-back-btn" style="display:none;">← 返回</button>

  <!-- ==================== 第0页：登录 ==================== -->
  <div class="page active" id="login-page">
    <div class="login-card">
      <h1>🎂</h1>
      <p class="subtitle">用户名是xgx哦～小写的～<br>聪明的小宝猜一下密码吧！很好猜的！都是数字～<br>输入正确了之后框框会变成绿色的～</p>
      <div class="input-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="login-btn" onclick="handleLogin()">登 录</button>
      <p class="error-msg" id="error-msg">用户名或密码错误，请重试</p>
    </div>
  </div>

  <!-- ==================== 第1页：计时器 + 问答 ==================== -->
  <div class="page" id="quiz-page">
    <div class="counter-content">
      <p class="time-label">💕 从2025年12月20日走到现在</p>
      <div class="counter-stats">
        <div class="counter-stat">
          <div class="number" id="counter-days">0</div>
          <div class="unit">天</div>
        </div>
        <div class="counter-stat">
          <div class="number" id="counter-hours">0</div>
          <div class="unit">时</div>
        </div>
        <div class="counter-stat">
          <div class="number" id="counter-minutes">0</div>
          <div class="unit">分</div>
        </div>
        <div class="counter-stat">
          <div class="number" id="counter-seconds">0</div>
          <div class="unit">秒</div>
        </div>
      </div>
    </div>

    <div class="quiz-card">
      <h2>🌸 今天是什么日子呀？</h2>
      <button class="quiz-option" onclick="chooseOption('A')">
        <span class="option-label">A</span> 是朵朵的亲亲宝贝小葛昕的生日呀～
      </button>
      <button class="quiz-option" onclick="chooseOption('B')">
        <span class="option-label">B</span> 徐葛昕的生日呀～
      </button>
      <button class="quiz-option" onclick="chooseOption('C')">
        <span class="option-label">C</span> 实力超强长得超萌非常厉害的会越来越好越来越强越来越棒的大女人徐葛昕的生日呀～
      </button>
    </div>
  </div>

  <!-- ==================== 第2页：结果 A ==================== -->
  <div class="page" id="result-a-page">
    <div class="result-content">
      <h1>💖 我爱你 💖</h1>

  <script>
    // ========== 全局状态 ==========
    let currentPage = 'login-page';
    let quizAnswered = false;

    // ========== 背景颜色映射 ==========
    const pageBackgrounds = {
      'login-page': 'bg-login',
      'quiz-page': 'bg-romantic',
      'result-a-page': 'bg-love',
      'result-b-page': 'bg-love',
      'result-c-page': 'bg-congrats',
      'birthday-page': 'bg-birthday',
      'letter-page': 'bg-romantic',
      'gallery-page': 'bg-love',
    };

    // ========== 全局返回按钮映射 ==========
    const backTargets = {
      'result-c-page': 'quiz-page',
      'birthday-page': 'result-c-page',
      'gallery-page': 'result-b-page',
    };

    // ========== 页面切换 ==========
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      currentPage = pageId;

      // 切换背景
      document.body.className = '';
      if (pageBackgrounds[pageId]) {
        document.body.classList.add(pageBackgrounds[pageId]);
      }

      // 全局返回按钮
      const backBtn = document.getElementById('global-back-btn');
      if (backTargets[pageId]) {
        backBtn.style.display = '';
        backBtn.setAttribute('data-target', backTargets[pageId]);
        // 恭喜页面用深色按钮
        if (pageId === 'result-c-page' || pageId === 'gallery-page') {
          backBtn.classList.add('dark');
        } else {
          backBtn.classList.remove('dark');
        }
      } else {
        backBtn.style.display = 'none';
      }

      // 特殊页面逻辑
      if (pageId === 'login-page') {
        const card = document.querySelector('.login-card');
        if (card) {
          card.style.boxShadow = '';
          card.style.border = '';
        }
        // 清空输入框并重置样式
        const uname = document.getElementById('username');
        const pwd = document.getElementById('password');
        if (uname) { uname.value = ''; setInputStyle(uname, false); }
        if (pwd) { pwd.value = ''; setInputStyle(pwd, false); }
      }

      if (pageId === 'birthday-page') startConfetti();
      else stopConfetti();

      if (pageId === 'quiz-page') {
        startHeartTrees();
        updateCounter();
      } else {
        stopHeartTrees();
      }

      if (pageId === 'gallery-page') {
        const gh = document.getElementById('gallery-heart');
        if (gh) gh.innerHTML = '<p class="gallery-loading" id="gallery-loading">💌</p>';
        galleryBuilt = false;
        galleryLoaded = 0;
        clearInterval(window._galleryEmojiTimer);
        var emojis = ['💌','💕','💗','💖','💝','✨','🌸'];
        var emojiIdx = 0;
        window._galleryEmojiTimer = setInterval(function() {
          emojiIdx = (emojiIdx + 1) % emojis.length;
          var el = document.getElementById('gallery-loading');
          if (el) el.textContent = emojis[emojiIdx];
        }, 400);
        setTimeout(buildGallery, 150);
      } else {
        clearInterval(window._galleryEmojiTimer);
      }

      if (pageId === 'result-a-page') startFloatingHearts('A');
      else if (pageId === 'result-b-page') startFloatingHearts('B');
      else if (pageId === 'result-c-page') startSparkleHearts();
      else stopFloatingHearts();
    }

    // ========== 登录逻辑 ==========
    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (username === 'xgx' && password === '060913') {
        errorMsg.classList.remove('show');
        const card = document.querySelector('.login-card');
        card.style.boxShadow = '0 0 40px rgba(72,199,142,0.6), 0 20px 60px rgba(0,0,0,0.1)';
        card.style.border = '2px solid #48c78e';
        setTimeout(() => showPage('quiz-page'), 400);
      } else {
        errorMsg.classList.add('show');
        const card = document.querySelector('.login-card');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = 'shake 0.5s ease';
      }
    }

    // 回车键登录
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('username').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    // ========== 实时输入验证：每个字段单独变绿 ==========
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    function setInputStyle(inp, valid) {
      if (valid) {
        inp.style.borderColor = '#48c78e';
        inp.style.background = '#f0faf5';
        inp.style.boxShadow = '0 0 0 4px rgba(72,199,142,0.1)';
      } else {
        inp.style.borderColor = '';
        inp.style.background = '';
        inp.style.boxShadow = '';
      }
    }

    usernameInput.addEventListener('input', function() {
      setInputStyle(this, this.value.trim() === 'xgx');
    });
    passwordInput.addEventListener('input', function() {
      setInputStyle(this, this.value.trim() === '060913');
    });

    // 抖动动画
    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        60% { transform: translateX(-7px); }
        80% { transform: translateX(7px); }
      }
    `;
    document.head.appendChild(shakeStyle);

    // ========== 全局返回按钮点击 ==========
    document.getElementById('global-back-btn').addEventListener('click', function() {
      const target = this.getAttribute('data-target');
      if (target) showPage(target);
    });

    // ========== 选择题逻辑 ==========
    function chooseOption(option) {
      if (option === 'A') showPage('result-a-page');
      else if (option === 'B') showPage('result-b-page');
      else if (option === 'C') showPage('result-c-page');
    }

    // ========== 计时器（北京时间 UTC+8，从 2025-12-20 00:00:00 开始） ==========
    function updateCounter() {
      const startDate = new Date('2025-12-20T00:00:00+08:00');

      function tick() {
        if (currentPage !== 'quiz-page') return;
        const now = new Date();
        const diff = now - startDate; // 毫秒差

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        document.getElementById('counter-days').textContent = days;
        document.getElementById('counter-hours').textContent = hours;
        document.getElementById('counter-minutes').textContent = minutes;
        document.getElementById('counter-seconds').textContent = seconds;

        requestAnimationFrame(() => {
          if (currentPage === 'quiz-page') setTimeout(tick, 1000);
        });
      }

      tick();
    }

    // ========== 爱心树画布 ==========
    const decoCanvas = document.getElementById('decoration-canvas');
    const decoCtx = decoCanvas.getContext('2d');
    let heartTreeAnimId = null;
    let floatingHeartsAnimId = null;
    let heartTrees = [];
    let floatingHearts = [];
    let sparkleParticles = [];

    function resizeDecoCanvas() {
      decoCanvas.width = window.innerWidth;
      decoCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeDecoCanvas);
    resizeDecoCanvas();

    // 画爱心路径
    function drawHeart(ctx, x, y, size, rotation) {
      ctx.save();
      ctx.translate(x, y);
      if (rotation) ctx.rotate(rotation);
      const s = size / 30;
      ctx.beginPath();
      ctx.moveTo(0, -5 * s);
      for (let t = 0; t <= Math.PI * 2; t += 0.02) {
        const hx = 15 * s * Math.pow(Math.sin(t), 3);
        const hy = -(13 * s * Math.cos(t) - 5 * s * Math.cos(2 * t) - 2 * s * Math.cos(3 * t) - Math.cos(4 * t));
        ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 生成爱心树数据
    function createHeartTrees() {
      heartTrees = [];
      const colors = ['#ff6b6b', '#ff8e8e', '#ffb3b3', '#f06292', '#ff80ab',
                      '#ff9a9e', '#f48fb1', '#ff5252', '#ff4081', '#e91e63'];
      for (let i = 0; i < 12; i++) {
        heartTrees.push({
          x: Math.random() * decoCanvas.width,
          y: decoCanvas.height - Math.random() * 60 - 10,
          trunkHeight: 40 + Math.random() * 80,
          trunkWidth: 3 + Math.random() * 5,
          crownSize: 20 + Math.random() * 30,
          hearts: Array.from({ length: 6 + Math.floor(Math.random() * 6) }, () => ({
            offsetX: (Math.random() - 0.5) * 50,
            offsetY: -(Math.random() * 50 + 20),
            size: 5 + Math.random() * 10,
            sway: Math.random() * Math.PI * 2,
            color: colors[Math.floor(Math.random() * colors.length)],
          })),
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.01 + Math.random() * 0.02,
        });
      }
    }

    function drawHeartTrees(time) {
      decoCtx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);

      heartTrees.forEach(tree => {
        const sway = Math.sin(time * tree.swaySpeed + tree.swayPhase) * 4;

        // 树干
        decoCtx.strokeStyle = '#8B5E3C';
        decoCtx.lineWidth = tree.trunkWidth;
        decoCtx.lineCap = 'round';
        decoCtx.beginPath();
        decoCtx.moveTo(tree.x, tree.y);
        decoCtx.lineTo(tree.x + sway * 0.3, tree.y - tree.trunkHeight);
        decoCtx.stroke();

        // 树冠上的爱心
        const crownX = tree.x + sway * 0.3;
        const crownY = tree.y - tree.trunkHeight;
        tree.hearts.forEach(h => {
          const hx = crownX + h.offsetX + Math.sin(time * 0.03 + h.sway) * 3;
          const hy = crownY + h.offsetY + Math.cos(time * 0.025 + h.sway) * 3;
          decoCtx.fillStyle = h.color;
          decoCtx.globalAlpha = 0.85;
          drawHeart(decoCtx, hx, hy, h.size, Math.sin(time * 0.02 + h.sway) * 0.3);
        });

        // 树冠底色圆
        decoCtx.globalAlpha = 0.3;
        decoCtx.fillStyle = '#ffb3b3';
        decoCtx.beginPath();
        decoCtx.arc(crownX, crownY - 10, tree.crownSize, 0, Math.PI * 2);
        decoCtx.fill();
        decoCtx.globalAlpha = 1;
      });
    }

    function heartTreeLoop(time) {
      drawHeartTrees(time);
      heartTreeAnimId = requestAnimationFrame(heartTreeLoop);
    }

    function startHeartTrees() {
      resizeDecoCanvas();
      createHeartTrees();
      if (!heartTreeAnimId) heartTreeAnimId = requestAnimationFrame(heartTreeLoop);
    }

    function stopHeartTrees() {
      if (heartTreeAnimId) {
        cancelAnimationFrame(heartTreeAnimId);
        heartTreeAnimId = null;
      }
      decoCtx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);
    }

    // ========== 飘浮爱心（结果 A/B 页面） ==========
    function createFloatingHearts() {
      floatingHearts = [];
      const colors = ['#ff6b6b', '#ff8e8e', '#ffb3b3', '#f06292', '#ff80ab',
                      '#ff9a9e', '#f48fb1', '#ff5252', '#ff4081'];
      for (let i = 0; i < 40; i++) {
        floatingHearts.push({
          x: Math.random() * decoCanvas.width,
          y: decoCanvas.height + Math.random() * 200,
          size: 8 + Math.random() * 16,
          speedY: -(0.5 + Math.random() * 1.8),
          speedX: (Math.random() - 0.5) * 0.8,
          color: colors[Math.floor(Math.random() * colors.length)],
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.01 + Math.random() * 0.03,
        });
      }
    }

    function drawAndUpdateFloatingHearts(time) {
      decoCtx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);
      floatingHearts.forEach(h => {
        h.y += h.speedY;
        h.sway += h.swaySpeed;
        h.x += Math.sin(h.sway) * 0.5 + h.speedX;

        if (h.y < -40) {
          h.y = decoCanvas.height + 40;
          h.x = Math.random() * decoCanvas.width;
        }
        if (h.x < -40) h.x = decoCanvas.width + 40;
        if (h.x > decoCanvas.width + 40) h.x = -40;

        decoCtx.fillStyle = h.color;
        decoCtx.globalAlpha = 0.8;
        drawHeart(decoCtx, h.x, h.y, h.size, Math.sin(time * 0.015 + h.sway) * 0.3);
      });
      decoCtx.globalAlpha = 1;
      floatingHeartsAnimId = requestAnimationFrame(drawAndUpdateFloatingHearts);
    }

    function startFloatingHearts(which) {
      resizeDecoCanvas();
      createFloatingHearts();
      if (!floatingHeartsAnimId) {
        floatingHeartsAnimId = requestAnimationFrame(drawAndUpdateFloatingHearts);
      }
    }

    function stopFloatingHearts() {
      if (floatingHeartsAnimId) {
        cancelAnimationFrame(floatingHeartsAnimId);
        floatingHeartsAnimId = null;
      }
    }

    // ========== 闪烁爱心粒子（结果 C 页面） ==========
    function startSparkleHearts() {
      resizeDecoCanvas();
      sparkleParticles = [];
      const colors = ['#ff6b6b', '#ffd93d', '#ff9a9e', '#fff', '#ffb3b3', '#fecfef'];
      for (let i = 0; i < 60; i++) {
        sparkleParticles.push({
          x: Math.random() * decoCanvas.width,
          y: Math.random() * decoCanvas.height,
          size: 3 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.03 + Math.random() * 0.06,
          life: Math.random(),
        });
      }

      function sparkleLoop(time) {
        if (currentPage !== 'result-c-page') return;
        decoCtx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);
        sparkleParticles.forEach(p => {
          p.twinkle += p.twinkleSpeed;
          const alpha = 0.3 + Math.abs(Math.sin(p.twinkle)) * 0.7;
          decoCtx.fillStyle = p.color;
          decoCtx.globalAlpha = alpha;
          decoCtx.beginPath();
          decoCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          decoCtx.fill();
        });
        decoCtx.globalAlpha = 1;
        if (currentPage === 'result-c-page') {
          requestAnimationFrame(sparkleLoop);
        }
      }
      requestAnimationFrame(sparkleLoop);
    }

    // ========== 彩带效果（生日页面） ==========
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiPieces = [];
    let confettiAnimId = null;

    function resizeConfettiCanvas() {
      if (!confettiCanvas) return;
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);
    resizeConfettiCanvas();

    function createConfetti() {
      const colors = [
        '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
        '#ff922b', '#ff6eb4', '#845ef7', '#20c997',
        '#f06595', '#ffe066', '#748ffc', '#8ce99a',
        '#f783ac', '#ffa94d', '#a9e34b', '#79d2f2'
      ];
      confettiPieces = [];
      for (let i = 0; i < 180; i++) {
        confettiPieces.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height - confettiCanvas.height,
          w: Math.random() * 12 + 5,
          h: Math.random() * 8 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 2.5 + 1.5,
          speedX: (Math.random() - 0.5) * 1.5,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 6,
          swaySpeed: Math.random() * 0.02 + 0.01,
          swayAmount: Math.random() * 0.8 + 0.3,
          time: Math.random() * Math.PI * 2,
        });
      }
    }

    function drawConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiPieces.forEach(p => {
        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confettiCtx.restore();
      });
    }

    function updateConfetti() {
      confettiPieces.forEach(p => {
        p.y += p.speedY;
        p.time += p.swaySpeed;
        p.x += Math.sin(p.time) * p.swayAmount + p.speedX * 0.3;
        p.rotation += p.rotationSpeed;
        if (p.y > confettiCanvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * confettiCanvas.width;
        }
        if (p.x > confettiCanvas.width + 30) p.x = -30;
        if (p.x < -30) p.x = confettiCanvas.width + 30;
      });
    }

    function confettiLoop() {
      drawConfetti();
      updateConfetti();
      confettiAnimId = requestAnimationFrame(confettiLoop);
    }

    function startConfetti() {
      resizeConfettiCanvas();
      createConfetti();
      if (!confettiAnimId) confettiLoop();
    }

    function stopConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      if (confettiCtx) confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    // ========== 初始化：启动登录页背景 ==========
    document.body.classList.add('bg-login');

    // ========== 照片墙：爱心形状布局 ==========
    const PHOTOS = [
      'photos/49117.jpg','photos/51575.jpg','photos/51576.jpg','photos/51601.jpg','photos/57030.jpg','photos/57037.jpg','photos/57050.jpg','photos/57334.jpg','photos/58371.jpg',
      'photos/5d8e73871e724494d2ce313f8544e93e.jpg','photos/60423.jpg','photos/61325.jpg','photos/61504.jpg','photos/61505.jpg','photos/61511.jpg','photos/61700.jpg',
      'photos/6d06890acb1a7d93e44c236abb396b60.jpg','photos/9548_livephoto.jpg','photos/98981cfd16e35e5cee095b2719feeaad.jpg',
      'photos/9c29ca50796cba0c08c9d41180687a94.jpg','photos/a4100f80bde34719cb7d97bfd33c1814.jpg',
      'photos/af20ae076252f5e76017dbb08847aa_livephoto.jpg','photos/bbcfadff53babb94554982be075f31_livephoto.jpg',
      'photos/bcbb91eaa908cc7896c991ed9d3cb190.jpg','photos/img_0348.jpg','photos/img_0364.jpg','photos/img_0373.jpg','photos/img_0887.jpg',

      'photos/img_6191.jpg','photos/img_6202.jpg','photos/img_6315.jpg','photos/img_6336.jpg','photos/img_6354.jpg','photos/img_6514.jpg','photos/img_6517.jpg',

      'photos/7950f6876f3098a0c22c163fdc3285ad.jpg','photos/bfd9e96c94638430d67fcb174b633a7b.jpg'
    ];

    let galleryBuilt = false;
    let galleryLoaded = 0;

    // ===== 预加载：<link rel="prefetch"> + 隐藏 img，页面打开立即全部开始下载 =====
    (function preloadAll() {
      // prefetch 通知浏览器后台下载
      var linkFrag = document.createDocumentFragment();
      for (var i = 0; i < PHOTOS.length; i++) {
        var lnk = document.createElement('link');
        lnk.rel = 'prefetch';
        lnk.as = 'image';
        lnk.href = PHOTOS[i];
        linkFrag.appendChild(lnk);
      }
      document.head.appendChild(linkFrag);
      // 分批 Image() 预加载,每批8张,避免118个请求同时轰炸
      var pi = 0;
      function preloadBatch() {
        var end = Math.min(pi + 8, PHOTOS.length);
        for (; pi < end; pi++) (new Image()).src = PHOTOS[pi];
        if (pi < PHOTOS.length) setTimeout(preloadBatch, 30);
      }
      preloadBatch();
    })();

    function buildGallery() {
      if (galleryBuilt) return;
      galleryBuilt = true;
      var C = document.getElementById('gallery-heart');
      var L = document.getElementById('gallery-loading');
      var viewW = window.innerWidth * 0.96, viewH = window.innerHeight * 0.88;
      if (viewW < 200 || viewH < 200) { galleryBuilt = false; setTimeout(buildGallery, 100); return; }

      // 固定逻辑坐标 1200×800，等比缩放到实际窗口 — 保证任何屏幕形状一致
      var FW = 1200, FH = 800;
      var scale = Math.min(viewW / FW, viewH / FH);
      var W = Math.round(FW * scale), H = Math.round(FH * scale);
      var offX = Math.round((viewW - W) / 2), offY = Math.round((viewH - H) / 2);

      // 照片尺寸：大屏幕更大，但有上下限
      var pSizeLog = Math.round(34 + (scale - 0.5) * 20);
      if (pSizeLog < 30) pSizeLog = 30;
      if (pSizeLog > 52) pSizeLog = 52;

      // 三列 — 形状更宽,填满
      var colW = FW * 0.32, gap = FW * 0.012;
      var totalW = colW*3 + gap*2, left = (FW-totalW)/2;
      var colH = FH * 0.86, top = (FH-colH)/2;

      var cx1 = left + colW/2, cx2 = left + colW + gap + colW/2, cx3 = left + (colW+gap)*2 + colW/2;
      var cy = top + colH/2;

      var spacing = pSizeLog * 0.75;  // 极其紧凑

      // ===== 辅助：给定线段+目标点数,返回等距坐标 =====
      function fillLine(sx,sy,ex,ey,n) {
        var res=[], dx=ex-sx, dy=ey-sy;
        for(var i=0;i<n;i++){var f=i/(n-1||1);res.push({x:sx+dx*f+Math.random()*2-1,y:sy+dy*f+Math.random()*2-1});}
        return res;
      }
      function fillArc(cx,cy,r,from,to,n){
        var res=[];
        for(var i=0;i<n;i++){var a=from+(to-from)*i/(n-1||1);res.push({x:cx+Math.cos(a)*r+Math.random()*2-1,y:cy+Math.sin(a)*r+Math.random()*2-1});}
        return res;
      }

      // ===== 按线段长度比例分配照片 =====
      var total = PHOTOS.length;
      var need2 = Math.floor(total*0.22); // ~26张给2
      var need0 = Math.floor(total*0.22); // ~26张给0
      var needH = total - need2 - need0;   // ~66张给心

      // "2"的四段路径长度
      var sw2 = colW*0.92, sh2 = colH*0.82;
      var xL = cx1-sw2/2, xR = cx1+sw2/2, yT = cy-sh2/2, yB = cy+sh2/2;
      var r2 = sw2*0.45, aCX = xR-r2, aCY = yT+r2;
      // 各段比例: 顶横:弧:对角:底横
      var segLens = [
        (aCX-xL),                      // top
        (Math.PI/2*r2),                // arc (90°)
        Math.sqrt((xL-xR)*(xL-xR) + (yB-yT-r2)*(yB-yT-r2)),  // diagonal
        (xR*0.84 - xL)                 // bottom
      ];
      var totalLen = segLens[0]+segLens[1]+segLens[2]+segLens[3];
      var nums = segLens.map(function(l){return Math.max(1,Math.round(need2*l/totalLen));});
      // 微调使总和=need2
      { var diff=need2-(nums[0]+nums[1]+nums[2]+nums[3]); if(diff>0)nums[2]+=diff; else if(diff<0)nums[3]+=diff; if(nums[3]<1)nums[3]=1; if(nums[2]<1)nums[2]=1; }

      var chosen2 = [].concat(
        fillLine(xL,yT, aCX,yT, nums[0]),
        fillArc(aCX,aCY,r2,-Math.PI/2,0, nums[1]),
        fillLine(xR, yT+r2, xL+pSizeLog*0.5, yB-pSizeLog*0.5, nums[2]),
        fillLine(xL+pSizeLog*0.5, yB, xR*0.84, yB, nums[3])
      );

      // "0" 椭圆环
      var rx0=colW*0.38, ry0=colH*0.42;
      var chosen0 = [];
      for(var i=0;i<need0;i++){var a=i/need0*Math.PI*2;chosen0.push({x:cx2+Math.cos(a)*rx0+Math.random()*2-1,y:cy+Math.sin(a)*ry0+Math.random()*2-1});}

      // ===== "❤️" 填充（减少点数避免卡顿） =====
      var hs = Math.min(colW*1.05, colH*1.02)/36;
      var heartPts = [];
      for(var i=0;i<6000;i++){var t_=Math.random()*Math.PI*2,r_=Math.pow(Math.random(),0.5);var x=cx3+16*Math.pow(Math.sin(t_),3)*hs*r_;var y=cy-(13*Math.cos(t_)-5*Math.cos(2*t_)-2*Math.cos(3*t_)-Math.cos(4*t_))*hs*r_;if(x>4&&x<FW-4&&y>4&&y<FH-4)heartPts.push({x:x,y:y});}
      for(var i=heartPts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=heartPts[i];heartPts[i]=heartPts[j];heartPts[j]=t;}
      var chosenH=[], md2H=spacing*spacing;
      for(var i=0;i<heartPts.length&&chosenH.length<needH;i++){var p=heartPts[i];if(p.x<6||p.x>FW-6||p.y<6||p.y>FH-6)continue;var ok=true;for(var j=0;j<chosenH.length;j++){var dx=p.x-chosenH[j].x,dy=p.y-chosenH[j].y;if(dx*dx+dy*dy<md2H){ok=false;break;}}if(ok)chosenH.push(p);}
      if(chosenH.length<needH){md2H=(spacing*0.5)*(spacing*0.5);for(var i=0;i<heartPts.length&&chosenH.length<needH;i++){var p=heartPts[i];if(p.x<3||p.x>FW-3||p.y<3||p.y>FH-3)continue;var ok=true;for(var j=0;j<chosenH.length;j++){var dx=p.x-chosenH[j].x,dy=p.y-chosenH[j].y;if(dx*dx+dy*dy<md2H){ok=false;break;}}if(ok)chosenH.push(p);}}

      // 合并
      var chosen = chosen2.concat(chosen0).concat(chosenH);

      // ===== 缩放到实际像素 ====
      for (var i=0;i<chosen.length;i++) {
        chosen[i].x = Math.round(chosen[i].x * scale + offX);
        chosen[i].y = Math.round(chosen[i].y * scale + offY);
      }

      // ===== 放照片 =====
      var frag=document.createDocumentFragment(),total=chosen.length;
      for(var i=0;i<total;i++){var p=chosen[i],sz=pSizeLog*scale*(0.85+Math.random()*0.25),rot=(Math.random()-0.5)*20;var img=document.createElement('img');img.className='gallery-photo';img.decoding='async';img.style.cssText='left:'+(p.x-sz/2)+'px;top:'+(p.y-sz/2)+'px;width:'+sz+'px;height:'+sz+'px;transform:rotate('+rot+'deg);z-index:'+i+';';img.dataset.src=PHOTOS[i%PHOTOS.length];img.addEventListener('click',function(e){e.stopPropagation();openLightbox(this.dataset.src);});frag.appendChild(img);}
      if(total===0){clearInterval(window._galleryEmojiTimer);if(L)L.style.display='none';}C.appendChild(frag);
      // ===== 分批设 src（每批6张隔20ms），避免同时解码118张卡死主线程 =====
      var allImgs = C.querySelectorAll('.gallery-photo'), totalImgs = allImgs.length;
      var loadedCount = 0, batchSize = 6, idx = 0;
      function setNextBatch() {
        var end = Math.min(idx + batchSize, totalImgs);
        for (var j = idx; j < end; j++) {
          var el = allImgs[j];
          el.onload = function() { this.classList.add('shown'); loadedCount++; if (loadedCount >= totalImgs) { clearInterval(window._galleryEmojiTimer); if (L) L.style.display = 'none'; } };
          el.onerror = function() { this.classList.add('shown'); loadedCount++; if (loadedCount >= totalImgs) { clearInterval(window._galleryEmojiTimer); if (L) L.style.display = 'none'; } };
          el.src = el.dataset.src;
        }
        idx = end;
        if (idx < totalImgs) setTimeout(setNextBatch, 20);
        else setTimeout(function() {
          clearInterval(window._galleryEmojiTimer);
          if (L) L.style.display = 'none';
        }, 3000);
      }
      setNextBatch();
    }

    // ========== 灯箱 ==========
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ESC 关闭灯箱
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });

    // ========== 加载信件内容 ==========
    fetch('letter.txt')
      .then(res => {
        if (res.ok) return res.text();
        throw new Error('no letter file');
      })
      .then(text => {
        const content = document.getElementById('letter-content');
        if (text.trim()) {
          content.textContent = text.trim();
          content.classList.remove('placeholder');
        }
      })
      .catch(() => {});
  </script>
